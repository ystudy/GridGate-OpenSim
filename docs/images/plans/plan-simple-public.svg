rentColor"/><rect x="645.0" y="211" width="30" height="4" rx="2" fill="currentColor"/></g><text x="660.0" y="240" text-anchor="middle" class="title">This computer</text><text x="660.0" y="259" text-anchor="middle" class="sub">Runs the whole grid</text></g><path d="M192 110 L263 180" class="wire" stroke-width="1.8" marker-end="url(#ah)"/><path d="M192 300 L263 232" class="wire" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#ah)" marker-end="url(#ah)"/><path d="M437 210 L573 210" class="wire" stroke-width="1.8" marker-end="url(#ah)"/><rect x="447.0" y="199" width="116" height="22" rx="11" class="pill" stroke-width="1"/><text x="505" y="214" text-anchor="middle" class="pilltext">8002 + regions</text></svg>
