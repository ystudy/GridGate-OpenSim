<svg xmlns="http://www.w3.org/2000/svg" width="800" height="556" viewBox="0 0 800 556" role="img"><title>What each plan needs</title><desc>A table of the five plans and what each needs: a 64-bit computer, viewers, a public address, router port forwarding, a Grid Asset Server, an avatar on another grid.</desc><style>
