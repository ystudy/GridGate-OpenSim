<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>Grid Asset Server with Region Servers, network only</title><desc>A Grid Asset Server holds accounts, inventory and assets; Region Servers on the same network join it on private port 8003.</desc><style>
.purple .card{fill:#EEEDFE;stroke:#534AB7}.purple{color:#534AB7}.purple .title{fill:#3C3489}.purple .sub{fill:#534AB7}
.gray .card{fill:#F6F5F0;stroke:#888780}.gray{color:#5F5E5A}.gray .title{fill:#2C2C2A}.gray .sub{fill:#5F5E5A}
.teal .card{fill:#E1F5EE;stroke:#0F6E56}.teal{color:#0F6E56}.teal .title{fill:#085041}.teal .sub{fill:#0F6E56}
.net{fill:none;stroke:#888780}.netlabel{fill:#5F5E5A}.wire{stroke:#888780;fill:none}.ah{fill:#888780}
.pill{fill:#FFFFFF;stroke:#B4B2A9}.pilltext{fill:#444441}
.screen{fill:#E6F1FB}.land{fill:#639922}.cardfill{fill:#F6F5F0}
.rtitle{fill:#2C2C2A}.rsub{fill:#5F5E5A}.stripe{fill:#F6F5F0}
.chk{fill:#534AB7}.tick{stroke:#FFFFFF}.purple .num{fill:#FFFFFF}.wave{stroke:#378ADD}.opt{stroke:#534AB7;fill:none}.optick{stroke:#534AB7}.nd{stroke:#B4B2A9}
@media (prefers-color-scheme: dark){
.purple .card{fill:#26215C;stroke:#AFA9EC}.purple{color:#CECBF6}.purple .title{fill:#EEEDFE}.purple .sub{fill:#CECBF6}
.gray .card{fill:#2C2C2A;stroke:#888780}.gray{color:#D3D1C7}.gray .title{fill:#F1EFE8}.gray .sub{fill:#D3D1C7}
.teal .card{fill:#04342C;stroke:#5DCAA5}.teal{color:#9FE1CB}.teal .title{fill:#E1F5EE}.teal .sub{fill:#9FE1CB}
.net{stroke:#888780}.netlabel{fill:#B4B2A9}.wire{stroke:#9C9A92}.ah{fill:#9C9A92}
.pill{fill:#161B22;stroke:#5F5E5A}.pilltext{fill:#D3D1C7}
.screen{fill:#042C53}.land{fill:#97C459}.cardfill{fill:#2C2C2A}
.rtitle{fill:#F1EFE8}.rsub{fill:#B4B2A9}.stripe{fill:#161B22}
.chk{fill:#AFA9EC}.tick{stroke:#26215C}.purple .num{fill:#26215C}.wave{stroke:#85B7EB}.opt{stroke:#AFA9EC}.optick{stroke:#AFA9EC}.nd{stroke:#5F5E5A}
}
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}
.title{font-size:15px;font-weight:600}.sub{font-size:13px}
.netlabel{font-size:13px;font-weight:500}.hname{font-size:13px}.st{font-size:14px}.ss{font-size:12px}.bt{font-size:13px}
.rtitle{font-size:14px;font-weight:600}.rsub{font-size:12px}.pilltext{font-size:12px;font-weight:500}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect x="30" y="20" width="740" height="410" rx="16" class="net" stroke-width="1.4" stroke-dasharray="7 5"/><text x="48" y="46" class="netlabel">Your network (nobody outside can reach in)</text><g class="purple"><rect x="300" y="60" width="200" height="130" rx="12" class="card" stroke-width="1.3"/><g stroke-width="2"><rect x="381.0" y="77" width="38" height="54" rx="4" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" fill="none"/><rect x="388.0" y="84" width="24" height="10" rx="2" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6" fill="none"/><circle cx="406.0" cy="89" r="2" class="land"/><rect x="388.0" y="99" width="24" height="10" rx="2" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6" fill="none"/><circle cx="406.0" cy="104" r="2" class="land"/><rect x="388.0" y="114" width="24" height="10" rx="2" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.6" fill="none"/><circle cx="406.0" cy="119" r="2" class="land"/></g><text x="400.0" y="155" text-anchor="middle" class="title">Grid Asset Server</text><text x="400.0" y="174" text-anchor="middle" class="sub">Accounts, inventory, assets</text></g><g class="purple"><rect x="70" y="270" width="170" height="130" rx="12" class="card" stroke-width="1.3"/><g stroke-width="2"><rect x="128.0" y="292" width="54" height="38" rx="4" class="screen" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round"/><path d="M137.0 326 Q153.0 310 173.0 326 Z" class="land"/><line x1="159.0" y1="318" x2="159.0" y2="308" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round"/><circle cx="159.0" cy="304" r="5" class="land"/><rect x="151.0" y="330" width="8" height="6" fill="currentColor"/><rect x="140.0" y="3