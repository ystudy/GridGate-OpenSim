<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img"><title>Local plan</title><desc>One computer runs the whole grid; only viewers on the same network can visit.</desc><style>
.purple .card{fill:#EEEDFE;stroke:#534AB7}.purple{color:#534AB7}.purple .title{fill:#3C3489}.purple .sub{fill:#534AB7}
.gray .card{fill:#F6F5F0;stroke:#888780}.gray{color:#5F5E5A}.gray .title{fill:#2C2C2A}.gray .sub{fill:#5F5E5A}
.teal .card{fill:#E1F5EE;stroke:#0F6E56}.teal{color:#0F6E56}.teal .title{fill:#085041}.teal .sub{fill:#0F6E56}
.net{fill:none;stroke:#888780}.netlabel{fill:#5F5E5A}.wire{stroke:#888780;fill:none}.ah{fill:#888780}
.pill{fill:#FFFFFF;stroke:#B4B2A9}.pilltext{fill:#444441}
.screen{fill:#E6F1FB}.land{fill:#639922}.cardfill{fill:#F6F5F0}
.rtitle{fill:#2C2C2A}.rsub{fill:#5F5E5A}.stripe{fill:#F6F5F0}
.chk{fill:#534AB7}.tick{stroke:#FFFFFF}.purple .num{fill:#FFFFFF}.wave{stroke:#378ADD}.opt{stroke:#534AB7;fill:none}.optick{stroke:#534AB7}.nd{stroke:#B4B2A9}
@media (prefers-color-scheme: dark){
.purple .card{fill:#26215C;stroke:#AFA9EC}.purple{color:#CECBF6}.purple .title{fill:#EEEDFE}.purple .sub{fill:#CECBF6}
.gray .card{fill:#2C2C2A;stroke:#888780}.gray{color:#D3D1C7}.gray .title{fill:#F1EFE8}.gray .sub{fill:#D3D1C7}
.teal .card{fill:#04342C;stroke:#5DCAA5}.teal{color:#9FE1CB}.teal .title{fill:#E1F5EE}.teal .sub{fill:#9FE1CB}
.net{stroke:#888780}.netlabel{fill:#B4B2A9}.wire{stroke:#9C9A92}.ah{fill:#9C9A92}
.pill{fill:#161B22;stroke:#5F5E5A}.pilltext{fill:#D3D1C7}
.screen{fill:#042C53}.land{fill:#97C459}.cardfill{fill:#2C2C2A}
.rtitle{fill:#F1EFE8}.rsub{fill:#B4B2A9}.stripe{fill:#161B22}
.chk{fill:#AFA9EC}.tick{stroke:#26215C}.purple .num{fill:#26215C}.wave{stroke:#85B7EB}.opt{stroke:#AFA9EC}.optick{stroke:#AFA9EC}.nd{stroke:#5F5E5A}
}
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}
.title{font-size:15px;font-weight:600}.sub{font-size:13px}
.netlabel{font-size:13px;font-weight:500}.hname{font-size:13px}.st{font-size:14px}.ss{font-size:12px}.bt{font-size:13px}
.rtitle{font-size:14px;font-weight:600}.rsub{font-size:12px}.pilltext{font-size:12px;font-weight:500}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect x="30" y="20" width="560" height="380" rx="16" class="net" stroke-width="1.4" stroke-dasharray="7 5"/><text x="48" y="46" class="netlabel">Your home or office network</text><g class="purple"><rect x="225" y="60" width="170" height="130" rx="12" class="card" stroke-width="1.3"/><g stroke-width="2"><rect x="283.0" y="82" width="54" height="38" rx="4" class="screen" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round"/><path d="M292.0 116 Q308.0 100 328.0 116 Z" class="land"/><line x1="314.0" y1="108" x2="314.0" y2="98" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round"/><circle cx="314.0" cy="94" r="5" class="land"/><rect x="306.0" y="120" width="8" height="6" fill="currentColor"/><rect x="295.0" y="126" width="30" height="4" rx="2" fill="currentColor"/></g><text x="310.0" y="155" text-anchor="middle" class="title">This computer</text><text x="310.0" y="174" text-anchor="middle" class="sub">Runs the whole grid</text></g><g class="gray"><rect x="70" y="240" width="170" height="130" rx="12" class="card" stroke-width="1.3"/><g stroke-width="2"><circle cx="155.0" cy="276.0" r="7.0" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" class="cardfill"/><path d="M142.0 303.0 Q142.0 287.0 155.0 287.0 Q168.0 287.0 168.0 303.0 Z" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" class="cardfill"/></g><text x="155.0" y="335" text-anchor="middle" class="title">Your viewer</text><text x="155.0" y="354" text-anchor="middle" class="sub">Firestorm on your PC</text></g><g class="gray"><rect x="380" y="240" width="170" height="130" rx="12" class="card" stroke-width="1.3"/><g stroke-width="2"><circle cx="448.0" cy="276.0" r="5.6000000000000005" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" class="cardfill"/><path d="M437.6 297.6 Q437.6 284.8 448.0 284.8 Q458.4 284.8 458.4 297.6 Z" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" class="cardfill"/><circle cx="482.0" cy="276.0" r="5.6000000000000005" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" class="cardfill"/><path d="M471.6 297.6 Q471.6 284.8 482.0 284.8 Q492.4 284.8 492.4 297.6 Z" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" class="cardfill"/><circle cx="465.0" cy="279.0" r="7.0" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" class="cardfill"/><path d="M452.0 306.0 Q452.0 290.0 465.0 290.0 Q478.0 290.0 478.0 306.0 Z" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" class="cardfill"/></g><text x="465.0" y="335" text-anchor="middle" class="title">Friends' viewers</text><text x="465.0" y="354" text-anchor="middle" class="sub">Same network only</text></g><path d="M170 238 L255 194" class="wire" stroke-width="1.8" marker-end="url(#ah)"/><path d="M450 238 L365 194" class="wire" stroke-width="1.8" marker-end="url(#ah)"/><g class="gray"><rect x="610" y="150" width="170" height="130" rx="12" class="card" stroke-width="1.3" stroke-dasharray="6 4"/><g stroke-width="2"><path d="M669.0 208 H717.0 A11 11 0 0 0 712.0 189 A15 15 0 0 0 685.0 185 A12 12 0 0 0 669.0 208 Z" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" fill="none"/><line x1="681.0" y1="192" x2="705.0" y2="204" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round"/><line x1="705.0" y1="192" x2="681.0" y2="204" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round"/></g><text x="695.0" y="245" text-anchor="middle" class="title">Internet</text><text x="695.0" y="264" text-anchor="middle" class="sub">Can't reach in</text></g></svg>
