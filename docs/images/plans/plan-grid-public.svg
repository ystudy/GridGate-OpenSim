<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img"><title>Grid Asset Server with Region Servers, public</title><desc>Visitors and other grids reach your router; it forwards 8002 to the Grid Asset Server and region ports to each Region Server, which join the Grid Asset Server on 8003.</desc><style>
