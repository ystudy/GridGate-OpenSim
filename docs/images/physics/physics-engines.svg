<svg xmlns="http://www.w3.org/2000/svg" width="800" height="904" viewBox="0 0 800 904" role="img"><title>Physics engines: busy regions, start-up, freeze and wake</title><desc>Physics engines compared. Busy region, physics milliseconds per 91 ms frame, ubODE then Rapier: 100 objects moving 1.5 and 3.0; 500 in a pile 48.4 and 10.9; 1,000 moving 29.3 and 26.5; 2,000 moving 121.4 (region at a quarter speed) and 57.9; DragonFyre with a 500-object pile 54.8 and 14.2. DragonFyre start-up: ubODE before the fix 19.7 s, ubODE in GridGate 5.3 s with about 500 MB, Rapier 7.8 s with about 650 MB. Freeze test (not in GridGate yet): cold start 5.3 s, freeze 0.005 s, wake 0.015 s, memory 468 MB to 82 MB while frozen.</desc><style>
.purple .card{fill:#EEEDFE;stroke:#534AB7}.purple{color:#534AB7}.purple .title{fill:#3C3489}.purple .sub{fill:#534AB7}
.gray .card{fill:#F6F5F0;stroke:#888780}.gray{color:#5F5E5A}.gray .title{fill:#2C2C2A}.gray .sub{fill:#5F5E5A}
.teal .card{fill:#E1F5EE;stroke:#0F6E56}.teal{color:#0F6E56}.teal .title{fill:#085041}.teal .sub{fill:#0F6E56}
.net{fill:none;stroke:#888780}.netlabel{fill:#5F5E5A}.wire{stroke:#888780;fill:none}.ah{fill:#888780}
.pill{fill:#FFFFFF;stroke:#B4B2A9}.pilltext{fill:#444441}
.screen{fill:#E6F1FB}.land{fill:#639922}.cardfill{fill:#F6F5F0}
.rtitle{fill:#2C2C2A}.rsub{fill:#5F5E5A}.stripe{fill:#F6F5F0}
.chk{fill:#534AB7}.tick{stroke:#FFFFFF}.purple .num{fill:#FFFFFF}.wave{stroke:#378ADD}.opt{stroke:#534AB7;fill:none}.optick{stroke:#534AB7}.nd{stroke:#B4B2A9}

.bu{fill:#534AB7}.br{fill:#1D9E75}.bo{fill:#B4B2A9}.grid{stroke:#EDEBE5}.limit{stroke:#A32D2D}.limtext{fill:#A32D2D}
.val{fill:#2C2C2A}.vsub{fill:#5F5E5A}.axis{fill:#5F5E5A}
@media (prefers-color-scheme: dark){
.purple .card{fill:#26215C;stroke:#AFA9EC}.purple{color:#CECBF6}.purple .title{fill:#EEEDFE}.purple .sub{fill:#CECBF6}
.gray .card{fill:#2C2C2A;stroke:#888780}.gray{color:#D3D1C7}.gray .title{fill:#F1EFE8}.gray .sub{fill:#D3D1C7}
.teal .card{fill:#04342C;stroke:#5DCAA5}.teal{color:#9FE1CB}.teal .title{fill:#E1F5EE}.teal .sub{fill:#9FE1CB}
.net{stroke:#888780}.netlabel{fill:#B4B2A9}.wire{stroke:#9C9A92}.ah{fill:#9C9A92}
.pill{fill:#161B22;stroke:#5F5E5A}.pilltext{fill:#D3D1C7}
.screen{fill:#042C53}.land{fill:#97C459}.cardfill{fill:#2C2C2A}
.rtitle{fill:#F1EFE8}.rsub{fill:#B4B2A9}.stripe{fill:#161B22}
.chk{fill:#AFA9EC}.tick{stroke:#26215C}.purple .num{fill:#26215C}.wave{stroke:#85B7EB}.opt{stroke:#AFA9EC}.optick{stroke:#AFA9EC}.nd{stroke:#5F5E5A}

.bu{fill:#7F77DD}.br{fill:#1D9E75}.bo{fill:#5F5E5A}.grid{stroke:#21262D}.limit{stroke:#E57373}.limtext{fill:#E57373}
.val{fill:#F1EFE8}.vsub{fill:#B4B2A9}.axis{fill:#B4B2A9}
}
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}
.title{font-size:15px;font-weight:600}.sub{font-size:13px}
.netlabel{font-size:13px;font-weight:500}.hname{font-size:13px}.st{font-size:14px}.ss{font-size:12px}.bt{font-size:13px}
.rtitle{font-size:14px;font-weight:600}.rsub{font-size:12px}.pilltext{font-size:12px;font-weight:500}

.val{font-size:12px;font-weight:600}.vsub{font-size:12px}.axis{font-size:11px}.limtext{font-size:11px;font-weight:500}
.sect{font-size:15px;font-weight:600}
</style><rect x="24" y="17" width="14" height="14" rx="3" class="bu"/><text x="46" y="29" class="rsub">ubODE, the default</text><rect x="189.2" y="17" width="14" height="14" rx="3" class="br"/><text x="211.2" y="29" class="rsub">Rapier, experimental</text><rect x="367.2" y="17" width="14" height="14" rx="3" class="bo"/><text x="389.2" y="29" class="rsub">ubODE before GridGate’s fix</text><text x="24" y="76" class="rtitle sect">Running a busy region</text><text x="24" y="96" class="rsub">Physics time in each 91 ms frame, lower is better. Above one frame, the whole region slows down.</text><line x1="280.0" y1="128" x2="280.0" y2="374" class="grid" stroke-width="1"/><text x="280.0" y="390" text-anchor="middle" class="axis">0</text><line x1="344.6" y1="128" x2="344.6" y2="374" class="grid" stroke-width="1"/><text x="344.6" y="390" text-anchor="middle" class="axis">20</text><line x1="409.2" y1="128" x2="409.2" y2="374" class="grid" stroke-width="1"/><text x="409.2" y="390" text-anchor="middle" class="axis">40</text><line x1="473.8" y1="128" x2="473.8" y2="374" class="grid" stroke-width="1"/><text x="473.8" y="390" text-anchor="middle" class="axis">60</text><line x1="538.5" y1="128" x2="538.5" y2="374" class="grid" stroke-width="1"/><text x="538.5" y="390" text-anchor="middle" class="axis">80</text><line x1="603.1" y1="128" x2="603.1" y2="374" class="grid" stroke-width="1"/><text x="603.1" y="390" text-anchor="middle" class="axis">100</text><line x1="667.7" y1="128" x2="667.7" y2="374" class="grid" stroke-width="1"/><text x="667.7" y="390" text-anchor="middle" class="axis">120</text><text x="24" y="146" class="rtitle">100 objects moving</text><text x="24" y="163" class="rsub">A quiet region</text><path d="M280 134 H282.4 Q284.8 134 284.8 136.42307692307693 V145.57692307692307 Q284.8 148 282.4 148 H280 Z" class="bu"><title>100 objects moving: ubODE 1.5 ms</title></path><text x="292.8" y="145" class="val">1.5 ms</text><path d="M280 150 H285.7 Q289.7 150 289.7 154 V160 Q289.7 164 285.7 164 H280 Z" class="br"><title>100 objects moving: Rapier 3 ms</title></path><text x="297.7" y="161" class="val">3 ms</text><text x="24" y="196" class="rtitle">500 objects in a pile</text><path d="M280 184 H432.4 Q436.4 184 436.4 188 V194 Q436.4 198 432.4 198 H280 Z" class="bu"><title>500 objects in a pile: ubODE 48.4 ms</title></path><text x="444.4" y="195" class="val">48.4 ms</text><path d="M280 200 H311.2 Q315.2 200 315.2 204 V210 Q315.2 214 311.2 214 H280 Z" class="br"><title>500 objects in a pile: Rapier 10.9 ms</title></path><text x="323.2" y="211" class="val">10.9 ms</text><text x="24" y="246" class="rtitle">1,000 objects moving</text><path d="M280 234 H370.7 Q374.7 234 374.7 238 V244 Q374.7 248 370.7 248 H280 Z" class="bu"><title>1,000 objects moving: ubODE 29.3 ms</title></path><text x="382.7" y="245" class="val">29.3 ms</text><path d="M280 250 H361.6 Q365.6 250 365.6 254 V260 Q365.6 264 361.6 264 H280 Z" class="br"><title>1,000 objects moving: Rapier 26.5 ms</title></path><text x="373.6" y="261" class="val">26.5 ms</text><text x="24" y="296" class="rtitle">2,000 objects moving</text><text x="24" y="313" class="rsub">ubODE slows the region to ¼ speed</text><path d="M280 284 H668.2 Q672.2 284 672.2 288 V294 Q672.2 298 668.2 298 H280 Z" class="bu"><title>2,000 objects moving: ubODE 121.4 ms</title></path><text x="680.2" y="295" class="val">121.4 ms</text><path d="M280 300 H463.1 Q467.1 300 467.1 304 V310 Q467.1 314 463.1 314 H280 Z" class="br"><title>2,000 objects moving: Rapier 57.9 ms</title></path><text x="475.1" y="311" class="val">57.9 ms</text><text x="24" y="346" class="rtitle">DragonFyre and a pile</text><text x="24" y="363" class="rsub">~5,000 meshes, 500 objects</text><path d="M280 334 H453.0 Q457.0 334 457.0 338 V344 Q457.0 348 453.0 348 H280 Z" class="bu"><title>DragonFyre and a pile: ubODE 54.8 ms</title></path><text x="465.0" y="345" class="val">54.8 ms</text><path d="M280 350 H321.9 Q325.9 350 325.9 354 V360 Q325.9 364 321.9 364 H280 Z" class="br"><title>DragonFyre and a pile: Rapier 14.2 ms</title></path><text x="333.9" y="361" class="val">14.2 ms</text><line x1="574.0" y1="120" x2="574.0" y2="374" class="limit" stroke-width="1.5" stroke-dasharray="5 4"/><text x="568.0" y="116" text-anchor="end" class="limtext">one frame, 91 ms</text><text x="280" y="408" class="axis">milliseconds</text><text x="24" y="452" class="rtitle sect">Starting a mesh-heavy region</text><text x="24" y="472" class="rsub">DragonFyre: 4,090 objects and about 5,000 meshes. Seconds until the region is ready, lower is better.</text><line x1="280.0" y1="490" x2="280.0" y2="618" class="grid" stroke-width="1"/><text x="280.0" y="634" text-anchor="middle" class="axis">0 s</text><line x1="385.0" y1="490" x2="385.0" y2="618" class="grid" stroke-width="1"/><text x="385.0" y="634" text-anchor="middle" class="axis">5 s</text><line x1="490.0" y1="490" x2="490.0" y2="618" class="grid" stroke-width="1"/><text x="490.0" y="634" text-anchor="middle" class="axis">10 s</text><line x1="595.0" y1="490" x2="595.0" y2="618" class="grid" stroke-width="1"/><text x="595.0" y="634" text-anchor="middle" class="axis">15 s</text><line x1="700.0" y1="490" x2="700.0" y2="618" class="grid" stroke-width="1"/><text x="700.0" y="634" text-anchor="middle" class="axis">20 s</text><text x="24" y="508" class="rtitle">ubODE before the fix</text><text x="24" y="525" class="rsub">The OpenSim original</text><path d="M280 496 H689.7 Q693.7 496 693.7 500 V506 Q693.7 510 689.7 510 H280 Z" class="bo"><title>ubODE before the fix: 19.7 s</title></path><text x="701.7" y="507" class="val">19.7 s</text><text x="24" y="552" class="rtitle">ubODE in GridGate</text><path d="M280 540 H387.3 Q391.3 540 391.3 544 V550 Q391.3 554 387.3 554 H280 Z" class="bu"><title>ubODE in GridGate: 5.3 s</title></path><text x="399.3" y="551" class="val">5.3 s<tspan class="vsub" dx="6">about 500 MB of memory</tspan></text><text x="24" y="596" class="rtitle">Rapier</text><path d="M280 584 H439.8 Q443.8 584 443.8 588 V594 Q443.8 598 439.8 598 H280 Z" class="br"><title>Rapier: 7.8 s</title></path><text x="451.8" y="595" class="val">7.8 s<tspan class="vsub" dx="6">about 650 MB of memory</tspan></text><text x="24" y="680" class="rtitle sect">Freezing a region and waking it</text><text x="24" y="700" class="rsub">Tested on the bench, not in GridGate yet. A frozen region uses no CPU and gives most of its memory back.</text><line x1="280.0" y1="718" x2="280.0" y2="846" class="grid" stroke-width="1"/><text x="280.0" y="862" text-anchor="middle" class="axis">0 s</text><line x1="385.0" y1="718" x2="385.0" y2="846" class="grid" stroke-width="1"/><text x="385.0" y="862" text-anchor="middle" class="axis">5 s</text><line x1="490.0" y1="718" x2="490.0" y2="846" class="grid" stroke-width="1"/><text x="490.0" y="862" text-anchor="middle" class="axis">10 s</text><line x1="595.0" y1="718" x2="595.0" y2="846" class="grid" stroke-width="1"/><text x="595.0" y="862" text-anchor="middle" class="axis">15 s</text><line x1="700.0" y1="718" x2="700.0" y2="846" class="grid" stroke-width="1"/><text x="700.0" y="862" text-anchor="middle" class="axis">20 s</text><text x="24" y="736" class="rtitle">Start it from cold</text><text x="24" y="753" class="rsub">ubODE in GridGate</text><path d="M280 724 H387.3 Q391.3 724 391.3 728 V734 Q391.3 738 387.3 738 H280 Z" class="bu"><title>Start it from cold: 5.3 s</title></path><text x="399.3" y="735" class="val">5.3 s</text><text x="24" y="780" class="rtitle">Freeze it</text><text x="24" y="797" class="rsub">While it runs</text><path d="M280 768 H281.0 Q282.0 768 282.0 769.0 V781.0 Q282.0 782 281.0 782 H280 Z" class="bu"><title>Freeze it: 0.005 s</title></path><text x="288.1" y="779" class="val">0.005 s<tspan class="vsub" dx="6">memory 468 MB → 82 MB</tspan></text><text x="24" y="824" class="rtitle">Wake it</text><text x="24" y="841" class="rsub">When a visitor arrives</text><path d="M280 812 H281.0 Q282.0 812 282.0 813.0 V825.0 Q282.0 826 281.0 826 H280 Z" class="bu"><title>Wake it: 0.015 s</title></path><text x="288.3" y="823" class="val">0.015 s<tspan class="vsub" dx="6">the teleport lands as usual</tspan></text><text x="400" y="890" text-anchor="middle" class="axis">Measured on a small test computer (2 cores, 2 GB). Bigger computers are faster, but the differences stay.</text></svg>
